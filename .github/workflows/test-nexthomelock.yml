name: Test Next Home Lock

on:
  pull_request:
    branches: [main]
    paths:
      - "diagnostics/nexthomelock/**"
      - ".github/workflows/test-nexthomelock.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install dpkg ldid

      - name: Check out source
        env:
          SOURCE_COMMIT: 24f5f967926335abb1fe0499dd25e63ab5821186
        run: |
          git clone --no-checkout https://github.com/zeshan0727/NextSolution.git "$RUNNER_TEMP/NextSolution"
          git -C "$RUNNER_TEMP/NextSolution" checkout "$SOURCE_COMMIT"

      - name: Build rootless
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos-rootless"
          export THEOS="$RUNNER_TEMP/theos-rootless"
          export THEOS_PACKAGE_SCHEME=rootless
          PROJECT="$RUNNER_TEMP/NextSolution/DailyTweaks/2026-07-30-NextHomeLock"
          make -C "$PROJECT" clean package FINALPACKAGE=1
          mkdir -p output
          cp "$(find "$PROJECT/packages" -type f -name '*.deb' -print -quit)" output/NextHomeLock_1.0.0_Rootless.deb

      - name: Build RootHide
        run: |
          THEOS_COMMIT="88506b2c22e9e07dd4ed055f23c9e398a117a2c7"
          git init "$RUNNER_TEMP/theos-roothide"
          git -C "$RUNNER_TEMP/theos-roothide" remote add origin https://github.com/roothide/theos.git
          git -C "$RUNNER_TEMP/theos-roothide" fetch --depth 1 origin "$THEOS_COMMIT"
          git -C "$RUNNER_TEMP/theos-roothide" checkout --detach "$THEOS_COMMIT"
          git -C "$RUNNER_TEMP/theos-roothide" submodule update --init --recursive --depth 1
          PROJECT="$RUNNER_TEMP/NextSolution/DailyTweaks/2026-07-30-NextHomeLock"
          sed -i '' 's/^Architecture: iphoneos-arm64$/Architecture: iphoneos-arm64e/' "$PROJECT/control"
          export THEOS="$RUNNER_TEMP/theos-roothide"
          export THEOS_PACKAGE_SCHEME=roothide
          make -C "$PROJECT" clean package FINALPACKAGE=1
          cp "$(find "$PROJECT/packages" -type f -name '*.deb' -print -quit)" output/NextHomeLock_1.0.0_RootHide.deb

      - name: Validate
        run: |
          set -euo pipefail
          test "$(dpkg-deb -f output/NextHomeLock_1.0.0_Rootless.deb Package)" = "com.nextsolution.nexthomelock"
          test "$(dpkg-deb -f output/NextHomeLock_1.0.0_RootHide.deb Package)" = "com.nextsolution.nexthomelock"
          test "$(dpkg-deb -f output/NextHomeLock_1.0.0_Rootless.deb Architecture)" = "iphoneos-arm64"
          test "$(dpkg-deb -f output/NextHomeLock_1.0.0_RootHide.deb Architecture)" = "iphoneos-arm64e"

      - uses: actions/upload-artifact@v4
        with:
          name: NextHomeLock-Diagnostic
          path: output/*.deb
          if-no-files-found: error
