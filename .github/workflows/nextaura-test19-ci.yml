name: Build NextAura Test 19 Smooth Interaction

on:
  pull_request:
    branches: [main]
    paths:
      - 'nextaura-test19/**'
      - '.github/workflows/nextaura-test19-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile universal smooth-interaction helper
        run: bash nextaura-test19/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NextAura-Test19-SmoothInteraction
          path: output/*
          if-no-files-found: error
      - name: Confirm compilation
        run: test -f output/ZZNextAuraSwitcherInteraction.dylib
