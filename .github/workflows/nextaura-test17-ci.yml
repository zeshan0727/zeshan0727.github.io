name: Build NextAura Test 17 Interaction

on:
  pull_request:
    branches: [main]
    paths:
      - 'nextaura-test17/**'
      - '.github/workflows/nextaura-test17-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile universal Test 17 helper
        run: bash nextaura-test17/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NextAura-Test17-Interaction
          path: output/*
          if-no-files-found: error
      - name: Confirm compilation
        run: test -f output/ZZNextAuraSwitcherInteraction.dylib
