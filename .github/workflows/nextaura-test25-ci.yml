name: Build NextAura Test 25 Direct Working Core

on:
  push:
    branches:
      - agent/nextaura-test25-direct-working-core
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile universal direct RootHide loader
        run: bash nextaura-test25/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NextAura-Test25-DirectWorkingCore
          path: output/*
          if-no-files-found: error
      - name: Save run ID for retrieval
        run: |
          mkdir -p nextaura-test25-output
          echo "${{ github.run_id }}" > nextaura-test25-output/RunID.txt
          cp output/SHA256SUMS nextaura-test25-output/SHA256SUMS
          git config user.name "nextaura-ci"
          git config user.email "actions@users.noreply.github.com"
          git add nextaura-test25-output
          if ! git diff --cached --quiet; then
            git commit -m "Store Test 25 build metadata"
            git push origin HEAD:agent/nextaura-test25-direct-working-core
          fi
