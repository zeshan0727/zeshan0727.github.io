name: Cydia RootHide 0.4 Safe Launch

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cydia-roothide-arm64-hotfix.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Check out Cydia test branch
        uses: actions/checkout@v4
        with:
          ref: cydia-roothide-ios16
          fetch-depth: 0

      - name: Build launch-only diagnostic package
        id: package
        continue-on-error: true
        run: |
          set -o pipefail
          {
            set -euxo pipefail
            brew update
            brew install dpkg

            BASE_DEB="debfiles/CydiaInstaller_RootHide_1.1.38-0.3_iOS16.deb"
            test -f "$BASE_DEB"

            STAGE="$RUNNER_TEMP/cydia-stage"
            VALIDATE="$RUNNER_TEMP/validate"
            rm -rf "$STAGE" "$VALIDATE"
            dpkg-deb -R "$BASE_DEB" "$STAGE"

            # Remove every custom injection. This build tests only the converted Cydia app.
            rm -f "$STAGE/Library/MobileSubstrate/DynamicLibraries/CydiaRootHideCompat.dylib"
            rm -f "$STAGE/Library/MobileSubstrate/DynamicLibraries/CydiaRootHideCompat.plist"
            rm -f "$STAGE/usr/lib/DynamicPatches/CydiaRootHideCompat.dylib" 2>/dev/null || true

            python3 - "$STAGE/DEBIAN/control" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          text = re.sub(r"^Version:.*$", "Version: 1.1.38+roothide0.4", text, flags=re.M)
          text = re.sub(
              r"^Description:.*$",
              "Description: Launch-only diagnostic build of Cydia 1.1.38 for RootHide on iOS 16. Version 0.4 removes the custom compatibility dylib and all Next Solution injection filters to isolate the remaining launch crash. Sileo remains installed. Package installation inside Cydia is not yet supported by this diagnostic build.",
              text,
              flags=re.M,
          )
          path.write_text(text, encoding="utf-8")
          PY

            OUTPUT="$RUNNER_TEMP/CydiaInstaller_RootHide_1.1.38-0.4_SafeLaunch_iOS16.deb"
            dpkg-deb -Zzstd -b "$STAGE" "$OUTPUT"

            dpkg-deb -x "$OUTPUT" "$VALIDATE"
            test -f "$VALIDATE/Applications/Cydia.app/Cydia"
            test ! -e "$VALIDATE/Library/MobileSubstrate/DynamicLibraries/CydiaRootHideCompat.dylib"
            test ! -e "$VALIDATE/Library/MobileSubstrate/DynamicLibraries/CydiaRootHideCompat.plist"
            test ! -e "$VALIDATE/etc/apt/preferences.d/cydia"
            test ! -e "$VALIDATE/Library/LaunchDaemons"
            test "$(lipo -archs "$VALIDATE/Applications/Cydia.app/Cydia")" = arm64

            file "$VALIDATE/Applications/Cydia.app/Cydia"
            dpkg-deb -I "$OUTPUT"
            shasum -a 256 "$OUTPUT" | tee "$RUNNER_TEMP/CydiaInstaller_RootHide_0.4.sha256"
            echo "OUTPUT_DEB=$OUTPUT" >> "$GITHUB_ENV"
          } 2>&1 | tee "$RUNNER_TEMP/CydiaRootHide-0.4-build.log"

      - name: Publish result to test branch
        if: always()
        run: |
          set -euxo pipefail
          cp "$RUNNER_TEMP/CydiaRootHide-0.4-build.log" projects/CydiaRootHideCompat/CydiaRootHide-0.4-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/CydiaRootHideCompat/CydiaRootHide-0.4-build.log

          if [ -n "${OUTPUT_DEB:-}" ] && [ -f "${OUTPUT_DEB:-}" ]; then
            cp "$OUTPUT_DEB" debfiles/CydiaInstaller_RootHide_1.1.38-0.4_SafeLaunch_iOS16.deb
            cp "$RUNNER_TEMP/CydiaInstaller_RootHide_0.4.sha256" debfiles/CydiaInstaller_RootHide_0.4.sha256
            git add debfiles/CydiaInstaller_RootHide_1.1.38-0.4_SafeLaunch_iOS16.deb debfiles/CydiaInstaller_RootHide_0.4.sha256
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Publish Cydia RootHide 0.4 safe-launch diagnostic [skip ci]"
            git push origin HEAD:cydia-roothide-ios16
          fi

      - name: Enforce successful build
        if: always()
        run: test "${{ steps.package.outcome }}" = "success"
