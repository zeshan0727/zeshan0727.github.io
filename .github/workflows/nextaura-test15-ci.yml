name: Build NextAura Test 15 Helpers

on:
  pull_request:
    branches: [main]
    paths:
      - 'nextaura-test15/**'
      - '.github/workflows/nextaura-test15-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Compile universal helper dylibs
        id: compile
        continue-on-error: true
        run: |
          mkdir -p output
          set +e
          bash nextaura-test15/build.sh > output/build.log 2>&1
          STATUS=$?
          echo "$STATUS" > output/build.status
          exit "$STATUS"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NextAura-Test15-Helpers
          path: output/*
          if-no-files-found: error

      - name: Confirm compilation
        if: always()
        run: |
          test -f output/build.status
          test "$(cat output/build.status)" = "0"
