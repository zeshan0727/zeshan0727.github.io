name: Build NextAura Test 15 Helpers

on:
  pull_request:
    branches: [main]
    paths:
      - 'nextaura-test15/**'
      - '.github/workflows/nextaura-test15-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Compile universal helper dylibs
        run: bash nextaura-test15/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: NextAura-Test15-Helpers
          path: output/*
          if-no-files-found: error
