# Temporary PR release trigger: Next Home Lock 1.0.5 simple on-off preferences.
name: Build and Publish Next Home Lock

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/publish-nexthomelock.yml"]
  pull_request:
    branches: [main]
    paths: [".github/workflows/publish-nexthomelock.yml"]

permissions:
  contents: write

concurrency:
  group: publish-nexthomelock-1.0.5
  cancel-in-progress: false

jobs:
  build-validate-publish:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install dpkg ldid xz zstd

      - name: Fetch and validate source
        env:
          SOURCE_COMMIT: aa3085e76fa75a83cadeca6634375e92f45145c3
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/zeshan0727/NextSolution.git "$RUNNER_TEMP/NextSolution"
          git -C "$RUNNER_TEMP/NextSolution" checkout "$SOURCE_COMMIT"
          P="$RUNNER_TEMP/NextSolution/DailyTweaks/2026-07-30-NextHomeLock"

          for f in Tweak.xm NextHomeLock.plist control LICENSE Makefile Preferences/Makefile Preferences/NHLRootListController.h Preferences/NHLRootListController.m Preferences/Resources/Root.plist Preferences/Resources/Info.plist layout/Library/PreferenceLoader/Preferences/NextHomeLock.plist; do
            test -f "$P/$f"
          done

          grep -q '^Version: 1.0.5$' "$P/control"
          grep -q 'firmware (>= 16.0)' "$P/control"
          grep -q 'preferenceloader' "$P/control"
          grep -q '^ARCHS = arm64 arm64e$' "$P/Makefile"
          grep -q '^TARGET = iphone:clang:latest:16.0$' "$P/Makefile"
          grep -q '^THEOS_PACKAGE_SCHEME ?= roothide$' "$P/Makefile"
          grep -q 'SUBPROJECTS += Preferences' "$P/Makefile"
          grep -q 'BUNDLE_NAME = NextHomeLockPreferences' "$P/Preferences/Makefile"
          grep -q 'CFPreferences' "$P/Preferences/NHLRootListController.m"
          grep -q 'Enable Next Home Lock' "$P/Preferences/Resources/Root.plist"
          grep -q 'NHLRootListController' "$P/layout/Library/PreferenceLoader/Preferences/NextHomeLock.plist"
          grep -q 'Hao Nguyen' "$P/LICENSE"
          grep -q '<string>1.0.5</string>' "$P/Preferences/Resources/Info.plist"

          test "$(grep -c '<string>PSSwitchCell</string>' "$P/Preferences/Resources/Root.plist")" -eq 1
          test "$(grep -c '<string>PSButtonCell</string>' "$P/Preferences/Resources/Root.plist" || true)" -eq 0
          test "$(grep -c '<string>PSTitleValueCell</string>' "$P/Preferences/Resources/Root.plist" || true)" -eq 0
          ! grep -Eq 'Installed Version|Runtime Method|SpringBoard Injection|Touch Hook|Test Lock Now|Refresh Diagnostics' "$P/Preferences/Resources/Root.plist"

          plutil -lint "$P/Preferences/Resources/Root.plist"
          plutil -lint "$P/Preferences/Resources/Info.plist"
          plutil -lint "$P/layout/Library/PreferenceLoader/Preferences/NextHomeLock.plist"

          P="$P" python3 - <<'PY'
          import os
          from pathlib import Path
          s=(Path(os.environ['P'])/'Tweak.xm').read_text()
          required=['@"1.0.5"','%hook SBIconListView','touchesEnded:(NSSet *)touches withEvent:(UIEvent *)event','tapCount == 2','_simulateLockButtonPress','pluginUserAgent','lockAndDimDevice','SBLockScreenManager','SBSLockDevice','com.nextsolution.nexthomelock.preferences.changed','CFPreferencesCopyAppValue','%ctor']
          forbidden=['%hook SBRootFolderView','%hook SBIconController','UITapGestureRecognizer','NHLGestureHandler','gestureInstalled']
          for x in required: assert x in s, x
          for x in forbidden: assert x not in s, x
          assert s.index('%hook SBIconListView') < s.index('touchesEnded:(NSSet *)touches') < s.index('tapCount == 2')
          PY

      - name: Build Rootless and RootHide
        shell: bash
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/NextSolution/DailyTweaks/2026-07-30-NextHomeLock"
          OUT="$RUNNER_TEMP/nexthomelock-release"
          mkdir -p "$OUT"

          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos-rootless"
          export THEOS="$RUNNER_TEMP/theos-rootless"
          export THEOS_PACKAGE_SCHEME=rootless
          rm -rf "$P/packages"
          make -C "$P" clean package FINALPACKAGE=1
          D="$(find "$P/packages" -type f -name '*_iphoneos-arm64.deb' -print -quit)"
          test -n "$D"
          cp "$D" "$OUT/NextHomeLock_1.0.5_Rootless.deb"

          THEOS_COMMIT=88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git init "$RUNNER_TEMP/theos-roothide"
          git -C "$RUNNER_TEMP/theos-roothide" remote add origin https://github.com/roothide/theos.git
          git -C "$RUNNER_TEMP/theos-roothide" fetch --depth 1 origin "$THEOS_COMMIT"
          git -C "$RUNNER_TEMP/theos-roothide" checkout --detach "$THEOS_COMMIT"
          git -C "$RUNNER_TEMP/theos-roothide" submodule update --init --recursive --depth 1
          sed -i '' 's/^Architecture: iphoneos-arm64$/Architecture: iphoneos-arm64e/' "$P/control"
          export THEOS="$RUNNER_TEMP/theos-roothide"
          export THEOS_PACKAGE_SCHEME=roothide
          rm -rf "$P/packages"
          make -C "$P" clean package FINALPACKAGE=1
          D="$(find "$P/packages" -type f -name '*_iphoneos-arm64e.deb' -print -quit)"
          test -n "$D"
          cp "$D" "$OUT/NextHomeLock_1.0.5_RootHide.deb"

      - name: Validate packages
        shell: bash
        run: |
          set -euo pipefail
          validate() {
            deb="$1"; arch="$2"; x="$(mktemp -d)"
            test "$(dpkg-deb -f "$deb" Package)" = com.nextsolution.nexthomelock
            test "$(dpkg-deb -f "$deb" Version)" = 1.0.5
            test "$(dpkg-deb -f "$deb" Architecture)" = "$arch"
            dpkg-deb -f "$deb" Depends | grep -q 'firmware (>= 16.0)'
            dpkg-deb -f "$deb" Depends | grep -q mobilesubstrate
            dpkg-deb -f "$deb" Depends | grep -q preferenceloader

            dpkg-deb -x "$deb" "$x"
            dylib="$(find "$x" -type f -name NextHomeLock.dylib -print -quit)"
            filter="$(find "$x" -type f -path '*MobileSubstrate*' -name NextHomeLock.plist -print -quit)"
            entry="$(find "$x" -type f -path '*PreferenceLoader/Preferences*' -name NextHomeLock.plist -print -quit)"
            bundle="$(find "$x" -type d -name NextHomeLockPreferences.bundle -print -quit)"
            binary="$(find "$bundle" -type f -name NextHomeLockPreferences -print -quit)"
            root="$(find "$bundle" -type f -name Root.plist -print -quit)"
            info="$(find "$bundle" -type f -name Info.plist -print -quit)"
            for f in "$dylib" "$filter" "$entry" "$binary" "$root" "$info"; do test -n "$f"; done

            file "$dylib" | grep -q arm64
            file "$binary" | grep -q arm64
            grep -q com.apple.springboard "$filter"
            grep -q NextHomeLockPreferences "$entry"
            grep -q NHLRootListController "$entry"
            grep -q 'Enable Next Home Lock' "$root"
            grep -q '<string>1.0.5</string>' "$info"
            test "$(grep -c '<string>PSSwitchCell</string>' "$root")" -eq 1
            test "$(grep -c '<string>PSButtonCell</string>' "$root" || true)" -eq 0
            test "$(grep -c '<string>PSTitleValueCell</string>' "$root" || true)" -eq 0
            ! grep -Eq 'Installed Version|Runtime Method|SpringBoard Injection|Touch Hook|Test Lock Now|Refresh Diagnostics' "$root"
            plutil -lint "$entry"; plutil -lint "$root"; plutil -lint "$info"

            for s in SBIconListView 'touchesEnded:withEvent:' _simulateLockButtonPress pluginUserAgent lockAndDimDevice SBLockScreenManager SBSLockDevice com.nextsolution.nexthomelock.preferences.changed; do
              strings -a "$dylib" | grep -q "$s"
            done
            strings -a "$binary" | grep -q NHLRootListController
            strings -a "$binary" | grep -q setPreferenceValue
            if strings -a "$dylib" | grep -Eq 'SBRootFolderView|SBIconController|NHLGestureHandler|gestureInstalled'; then exit 1; fi
            rm -rf "$x"
          }

          O="$RUNNER_TEMP/nexthomelock-release"
          validate "$O/NextHomeLock_1.0.5_Rootless.deb" iphoneos-arm64
          validate "$O/NextHomeLock_1.0.5_RootHide.deb" iphoneos-arm64e
          shasum -a 256 "$O"/*.deb

      - name: Publish safely
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/nexthomelock-release"
          git config user.name 'Next Solution Build Bot'
          git config user.email actions@users.noreply.github.com

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p debfiles
            cp "$O"/*.deb debfiles/

            dpkg-scanpackages -m ./debfiles /dev/null | sed 's|^Filename: debfiles/|Filename: ./debfiles/|' > Packages
            test "$(grep -c '^Package: com.nextsolution.nexthomelock$' Packages)" -ge 2
            test "$(grep -c '^Version: 1.0.5$' Packages)" -eq 2
            test "$(grep -c 'NextHomeLock_1.0.5_Root' Packages)" -eq 2
            gzip -9 -c Packages > Packages.gz
            bzip2 -9 -c Packages > Packages.bz2
            xz -9e -c Packages > Packages.xz
            zstd -19 -q -c Packages > Packages.zst

            git add -A
            git diff --cached --check
            git commit -m 'Publish Next Home Lock 1.0.5 simple settings'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
