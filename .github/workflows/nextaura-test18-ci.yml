name: Build NextAura Test 18 Lock Screen

on:
  pull_request:
    branches: [main]
    paths:
      - 'nextaura-test18/**'
      - '.github/workflows/nextaura-test18-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile universal lock-screen styler
        run: bash nextaura-test18/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NextAura-Test18-LockScreen
          path: output/*
          if-no-files-found: error
      - name: Confirm compilation
        run: test -f output/ZZNextAuraLockScreenStyler.dylib
