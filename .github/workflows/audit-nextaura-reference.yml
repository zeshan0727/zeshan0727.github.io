name: Audit NextAura Reference

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-nextaura-reference.yml"

permissions:
  contents: write

concurrency:
  group: audit-nextaura-reference
  cancel-in-progress: false

jobs:
  audit:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out Sileo repository with branches
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install package inspection tools
        run: brew install dpkg

      - name: Audit working NextAura package and repositories
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/nextaura-reference.txt"
          EXTRACT="$RUNNER_TEMP/nextaura-extract"
          mkdir -p "$EXTRACT"

          {
            echo "NextAura working-reference audit"
            echo "Generated: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "=== Sileo repository branches ==="
            git for-each-ref --format='%(refname:short) %(objectname)' refs/remotes refs/heads | sort
            echo
            echo "=== Main-branch source matches in Sileo repository ==="
            grep -RInI -E 'NextAura|com\.nextsolution\.unlockvibrate|TWEAK_NAME.*(Aura|Unlock|Sweat)' . \
              --exclude='Packages*' --exclude='*.deb' --exclude='*.html' --exclude-dir='.git' | head -n 500 || true
          } > "$REPORT"

          DEB="debfiles/NextAura_4.4.8_RootHide_iOS16.deb"
          test -f "$DEB"
          dpkg-deb -x "$DEB" "$EXTRACT/root"
          dpkg-deb -e "$DEB" "$EXTRACT/control"

          {
            echo
            echo "=== NextAura DEB metadata ==="
            dpkg-deb -f "$DEB"
            echo
            echo "=== Installed file tree ==="
            find "$EXTRACT/root" -type f -o -type l | sed "s|$EXTRACT/root||" | sort
            echo
            echo "=== Control files ==="
            find "$EXTRACT/control" -maxdepth 2 -type f -print -exec sh -c 'echo --- "$1"; cat "$1"' _ {} \;
            echo
            echo "=== Property lists ==="
            while IFS= read -r plist; do
              echo "--- ${plist#$EXTRACT/root}"
              plutil -p "$plist" 2>/dev/null || cat "$plist" || true
            done < <(find "$EXTRACT/root" -type f -name '*.plist' | sort)
            echo
            echo "=== Mach-O files ==="
            while IFS= read -r binary; do
              echo "--- ${binary#$EXTRACT/root}"
              file "$binary"
              otool -L "$binary" 2>/dev/null || true
            done < <(find "$EXTRACT/root" -type f -perm -111 | sort)
            echo
            echo "=== SpringBoard/runtime strings from tweak binaries ==="
            while IFS= read -r binary; do
              if file "$binary" | grep -q 'Mach-O'; then
                echo "--- ${binary#$EXTRACT/root}"
                strings -a "$binary" | grep -Ei 'SB[A-Za-z0-9_]+|SpringBoard|gesture|tap|double|home.?screen|root.?folder|icon.?list|icon.?controller|didMoveToWindow|layoutSubviews|applicationDidFinishLaunching|Preference|Darwin|notify|lockUI|SBSLock|FBSSystem' | sort -u | head -n 1200 || true
              fi
            done < <(find "$EXTRACT/root" -type f | sort)
          } >> "$REPORT"

          git clone --no-checkout https://github.com/zeshan0727/NextSolution.git "$RUNNER_TEMP/NextSolution"
          git -C "$RUNNER_TEMP/NextSolution" fetch --all --prune '+refs/heads/*:refs/remotes/origin/*'

          {
            echo
            echo "=== NextSolution branches ==="
            git -C "$RUNNER_TEMP/NextSolution" for-each-ref --format='%(refname:short) %(objectname)' refs/remotes/origin | sort
            echo
            echo "=== NextAura/package matches across NextSolution branches ==="
            count=0
            while IFS= read -r branch; do
              matches="$(git -C "$RUNNER_TEMP/NextSolution" grep -n -I -E 'NextAura|com\.nextsolution\.unlockvibrate|TWEAK_NAME.*(Aura|Unlock|Sweat)' "$branch" -- ':!*.deb' ':!Packages*' 2>/dev/null | head -n 120 || true)"
              if [ -n "$matches" ]; then
                echo "--- $branch"
                echo "$matches"
                count=$((count + 1))
              fi
              [ "$count" -lt 30 ] || break
            done < <(git -C "$RUNNER_TEMP/NextSolution" for-each-ref --format='%(refname:short)' refs/remotes/origin | sort)
          } >> "$REPORT"

          mkdir -p diagnostics
          cp "$REPORT" diagnostics/nextaura-reference.txt

      - name: Publish audit report safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Next Solution Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add diagnostics/nextaura-reference.txt
          git commit -m "Audit working NextAura package and branches"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
